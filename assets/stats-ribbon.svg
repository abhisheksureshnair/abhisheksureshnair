<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 85" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111227" />
      <stop offset="100%" stop-color="#080914" />
    </linearGradient>

    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.35" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-border {{
      0%, 100% {{ stroke-opacity: 0.4; }}
      50% {{ stroke-opacity: 0.9; stroke: #c084fc; }}
    }}
    .stat-pill {{
      transition: all 0.3s;
    }}
    .stat-pill:hover {{
      transform: translateY(-2px);
    }}
  </style>

  <g transform="translate(5, 5)">
    <!-- 1. Repositories -->
    <g transform="translate(0, 0)" class="stat-pill">
      <rect width="174" height="75" rx="14" fill="url(#card-bg)" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
      <g transform="translate(20, 18)">
        <circle cx="16" cy="20" r="14" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" />
        <path d="M12 16 h8 v9 h-8 z M16 13 v3" stroke="#c084fc" stroke-width="1.5" fill="none" />
        <text x="42" y="16" fill="#f8fafc" font-size="18" font-family="sans-serif" font-weight="800">92+</text>
        <text x="42" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Repositories</text>
      </g>
    </g>

    <!-- 2. Stars -->
    <g transform="translate(184, 0)" class="stat-pill">
      <rect width="174" height="75" rx="14" fill="url(#card-bg)" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
      <g transform="translate(20, 18)">
        <circle cx="16" cy="20" r="14" fill="#3b0764" stroke="#fbbf24" stroke-width="1.5" />
        <polygon points="16,13 18,18 23,18.5 19.5,22 20.5,27 16,24.5 11.5,27 12.5,22 9,18.5 14,18" fill="#fbbf24" />
        <text x="42" y="16" fill="#f8fafc" font-size="18" font-family="sans-serif" font-weight="800">300+</text>
        <text x="42" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Total Stars</text>
      </g>
    </g>

    <!-- 3. Commits -->
    <g transform="translate(368, 0)" class="stat-pill">
      <rect width="174" height="75" rx="14" fill="url(#card-bg)" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
      <g transform="translate(20, 18)">
        <circle cx="16" cy="20" r="14" fill="#3b0764" stroke="#c084fc" stroke-width="1.5" />
        <path d="M16 12 v4 M16 24 v4 M16 20 a4 4 0 1 0 0 -8 a4 4 0 0 0 0 8" stroke="#c084fc" stroke-width="1.5" fill="none" />
        <text x="42" y="16" fill="#f8fafc" font-size="18" font-family="sans-serif" font-weight="800">1.2k+</text>
        <text x="42" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Commits</text>
      </g>
    </g>

    <!-- 4. Pull Requests -->
    <g transform="translate(552, 0)" class="stat-pill">
      <rect width="174" height="75" rx="14" fill="url(#card-bg)" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
      <g transform="translate(20, 18)">
        <circle cx="16" cy="20" r="14" fill="#082f49" stroke="#38bdf8" stroke-width="1.5" />
        <circle cx="13" cy="15" r="2.5" fill="#38bdf8" />
        <circle cx="13" cy="25" r="2.5" fill="#38bdf8" />
        <circle cx="20" cy="17" r="2.5" fill="#38bdf8" />
        <path d="M13 17.5 v5 M20 19.5 v2 C20 23.5 17 25 15.5 25" stroke="#38bdf8" stroke-width="1.3" fill="none" />
        <text x="42" y="16" fill="#f8fafc" font-size="18" font-family="sans-serif" font-weight="800">45+</text>
        <text x="42" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Pull Requests</text>
      </g>
    </g>

    <!-- 5. Experience -->
    <g transform="translate(736, 0)" class="stat-pill">
      <rect width="174" height="75" rx="14" fill="url(#card-bg)" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow)" />
      <g transform="translate(20, 18)">
        <circle cx="16" cy="20" r="14" fill="#3b0764" stroke="#e879f9" stroke-width="1.5" />
        <rect x="10" y="15" width="12" height="9" rx="1.5" stroke="#e879f9" stroke-width="1.5" fill="none" />
        <path d="M13 15 v-2 a1.5 1.5 0 0 1 3 0 v2" stroke="#e879f9" stroke-width="1.3" fill="none" />
        <text x="42" y="16" fill="#f8fafc" font-size="18" font-family="sans-serif" font-weight="800">3.5 Yrs</text>
        <text x="42" y="32" fill="#94a3b8" font-size="11" font-family="sans-serif" font-weight="500">Experience</text>
      </g>
    </g>
  </g>
</svg>