<text x="26" y="39" fill="#22D3EE" font-size="14" font-weight="700" font-family="Arial, sans-serif">01 / THE DEVELOPER</text><text x="26" y="82" fill="#F8FAFC" font-size="27" font-weight="700" font-family="Arial, sans-serif">Ideas into applications.</text><text x="26" y="123" fill="#C4B5FD" font-size="18" font-weight="400" font-family="Arial, sans-serif">My public projects span web, mobile</text><text x="26" y="151" fill="#C4B5FD" font-size="18" font-weight="400" font-family="Arial, sans-serif">and AI-assisted applications.</text><text x="26" y="201" fill="#C4B5FD" font-size="16" font-weight="400" font-family="Arial, sans-serif">Explore the code. Follow the progress.</text></svg>