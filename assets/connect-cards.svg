<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 180" width="100%" height="100%">
  <defs>
    <linearGradient id="card-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e0f22" />
      <stop offset="100%" stop-color="#070814" />
    </linearGradient>

    <linearGradient id="pill-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <filter id="glow">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#8b5cf6" flood-opacity="0.4" />
    </filter>
  </defs>

  <style>
    @keyframes pulse-link {{
      0%, 100% {{ stroke-opacity: 0.4; }}
      50% {{ stroke-opacity: 0.9; stroke: #c084fc; }}
    }}
    .contact-box {{
      transition: all 0.25s ease;
      cursor: pointer;
    }}
  </style>

  <!-- Container Box -->
  <rect x="2" y="2" width="916" height="176" rx="16" fill="url(#card-bg)" stroke="#6b21a8" stroke-width="1.5" stroke-opacity="0.6" />

  <!-- Header -->
  <g transform="translate(30, 26)">
    <path d="M2 14 L16 2 L10 16 L8 10 Z" fill="#c084fc" />
    <text x="24" y="13" fill="#f8fafc" font-size="16" font-family="sans-serif" font-weight="800" letter-spacing="0.3">Let&apos;s Connect</text>
    <text x="24" y="30" fill="#94a3b8" font-size="12" font-family="sans-serif">Feel free to reach out for collaborations, exciting opportunities or just to say hi!</text>
  </g>

  <!-- 4 Glowing Contact Cards -->
  <g transform="translate(30, 75)">
    <!-- 1. GitHub -->
    <g transform="translate(0, 0)" class="contact-box">
      <rect width="205" height="65" rx="12" fill="url(#pill-bg)" stroke="#6b21a8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <circle cx="26" cy="32" r="14" fill="#020617" stroke="#a855f7" stroke-width="1.2" />
      <path d="M26 24 C21.5 24 18 27.5 18 32 C18 35.5 20.3 38.5 23.5 39.5 C24 39.6 24.2 39.3 24.2 39 V37 C22 37.5 21.5 36 21.5 36 C21.2 35 20.6 34.6 20.6 34.6 C19.9 34.1 20.7 34.1 20.7 34.1 C21.5 34.2 22 34.9 22 34.9 C22.7 36.1 23.9 35.8 24.3 35.6 C24.4 35 24.6 34.6 24.9 34.3 C23.1 34.1 21.2 33.4 21.2 30.3 C21.2 29.4 21.5 28.7 22 28.1 C21.9 27.9 21.6 27 22.1 25.8 C22.1 25.8 22.8 25.6 24.4 26.7 C25.1 26.5 25.8 26.4 26.5 26.4 C27.2 26.4 27.9 26.5 28.6 26.7 C30.2 25.6 30.9 25.8 30.9 25.8 C31.4 27 31.1 27.9 31 28.1 C31.5 28.7 31.8 29.4 31.8 30.3 C31.8 33.4 29.9 34.1 28.1 34.3 C28.5 34.6 28.8 35.2 28.8 36.2 V39 C28.8 39.3 29 39.6 29.5 39.5 C32.7 38.5 35 35.5 35 32 C35 27.5 31.5 24 26 24 Z" fill="#f8fafc" />
      <text x="50" y="28" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="700">GitHub</text>
      <text x="50" y="46" fill="#a855f7" font-size="11" font-family="sans-serif" font-weight="500">/abhisheksureshnair</text>
    </g>

    <!-- 2. LinkedIn -->
    <g transform="translate(218, 0)" class="contact-box">
      <rect width="205" height="65" rx="12" fill="url(#pill-bg)" stroke="#6b21a8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <circle cx="26" cy="32" r="14" fill="#0284c7" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.2" />
      <text x="26" y="37" text-anchor="middle" fill="#38bdf8" font-size="13" font-family="sans-serif" font-weight="800">in</text>
      <text x="50" y="28" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="700">LinkedIn</text>
      <text x="50" y="46" fill="#38bdf8" font-size="11" font-family="sans-serif" font-weight="500">/in/abhisheksnair</text>
    </g>

    <!-- 3. Portfolio -->
    <g transform="translate(436, 0)" class="contact-box">
      <rect width="205" height="65" rx="12" fill="url(#pill-bg)" stroke="#6b21a8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <circle cx="26" cy="32" r="14" fill="#7c3aed" fill-opacity="0.2" stroke="#c084fc" stroke-width="1.2" />
      <circle cx="26" cy="32" r="7" stroke="#c084fc" stroke-width="1.2" fill="none" />
      <line x1="19" y1="32" x2="33" y2="32" stroke="#c084fc" stroke-width="1.2" />
      <ellipse cx="26" cy="32" rx="4" ry="7" stroke="#c084fc" stroke-width="1.2" fill="none" />
      <text x="50" y="28" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="700">Portfolio</text>
      <text x="50" y="46" fill="#c084fc" font-size="10.5" font-family="sans-serif" font-weight="500">abhisheksnair.vercel.app</text>
    </g>

    <!-- 4. Email -->
    <g transform="translate(654, 0)" class="contact-box">
      <rect width="205" height="65" rx="12" fill="url(#pill-bg)" stroke="#6b21a8" stroke-width="1.2" stroke-opacity="0.6" filter="url(#glow)" />
      <circle cx="26" cy="32" r="14" fill="#dc2626" fill-opacity="0.2" stroke="#f87171" stroke-width="1.2" />
      <rect x="20" y="27" width="12" height="9" rx="1" stroke="#f87171" stroke-width="1.2" fill="none" />
      <path d="M20 28 L26 32 L32 28" stroke="#f87171" stroke-width="1.2" fill="none" />
      <text x="50" y="28" fill="#cbd5e1" font-size="12" font-family="sans-serif" font-weight="700">Email</text>
      <text x="50" y="46" fill="#f87171" font-size="10" font-family="sans-serif" font-weight="500">nairsabhishek@gmail.com</text>
    </g>
  </g>
</svg>